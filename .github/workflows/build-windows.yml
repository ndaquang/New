name: Build Windows app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt

      - name: Chạy kiểm thử
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests

      - name: Tải trọng số VietOCR
        run: python -c "from app.engine.ocr import ensure_weights, BUNDLED_WEIGHTS; ensure_weights(BUNDLED_WEIGHTS)"

      - name: Đóng gói bằng PyInstaller
        run: pyinstaller DanhThiep.spec --noconfirm

      - name: Tự kiểm tra bản đã đóng gói (VietOCR thật, ảnh mẫu)
        env:
          PYTHONIOENCODING: utf-8
        run: dist\DanhThiep\DanhThiep.exe --selftest

      - name: Nén thành file zip
        shell: pwsh
        run: |
          Copy-Item "HUONG_DAN.txt" "dist\DanhThiep\"
          Compress-Archive -Path dist\DanhThiep -DestinationPath DanhThiep-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DanhThiep-Windows
          path: DanhThiep-Windows.zip
          retention-days: 30
